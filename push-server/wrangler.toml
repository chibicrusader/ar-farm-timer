# Cloudflare Worker config for the AR Farm Timer push server.
# scripts/deploy.sh fills in database_id after creating the D1 database.
name = "archerage-farm-timer-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Hostnames. The app talks to the custom domain push.artimer.win (zone WAF and
# rate-limiting rules apply there); the workers.dev URL stays on during the
# transition so installs still running an older build keep working. See
# README.md "Custom domain" before changing these.
workers_dev = true
# Not attached yet. To attach the custom domain on the next deploy, uncomment
# (or attach it in the dashboard: Workers > this Worker > Settings > Domains).
# routes = [
#   { pattern = "push.artimer.win", custom_domain = true },
# ]

[triggers]
crons = ["* * * * *"]   # every minute: watchdog (re-arms the scheduler alarm, sends anything missed)

# Second-precise delivery: one Durable Object whose alarm fires at the next
# alert's time. SQLite-backed classes are available on the Workers free plan.
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "AlertScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertScheduler"]

# Abuse limits (Workers Rate Limiting API, counters per Cloudflare location).
# RL_API: every POST, per client IP. RL_STRICT: /subscribe per IP and /test
# per subscription. RL_WRITE: /schedule, /sync and /cancel (the routes that
# write D1 rows), counted per IP and per subscription id with separate keys.
# The code skips a limiter whose binding is missing.
# namespace_id must be unique within your Cloudflare account.
[[ratelimits]]
name = "RL_API"
namespace_id = "7301"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_STRICT"
namespace_id = "7302"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "7303"
  [ratelimits.simple]
  limit = 30
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "archerage-farm-timer-push"
migrations_dir = "migrations"
database_id = "00000000-0000-0000-0000-000000000000"   # placeholder; scripts/deploy.sh creates the D1 database and fills this in

[vars]
# Public half of the VAPID key pair (safe to commit; set by scripts/deploy.sh).
VAPID_PUBLIC_KEY = ""
# Contact for push services (Apple requires a mailto: or https: URL).
VAPID_SUBJECT = "mailto:you@example.com"
# Comma-separated origins allowed to call the API, e.g. "https://you.github.io". "*" = any.
ALLOWED_ORIGINS = "https://archerage-farm-timer.pages.dev,https://artimer.win,https://www.artimer.win"
# Most push subscriptions stored at once (bounds D1 storage under abuse).
MAX_SUBSCRIPTIONS = "5000"
# Where tapping a notification opens the app if an alert has no url (the app sends its own origin).
APP_URL = "https://artimer.win/"
# VAPID_PRIVATE_JWK is a secret: `wrangler secret put VAPID_PRIVATE_JWK` (deploy.sh does it).
