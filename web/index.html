  <title>AR Farm Timer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12161C; }
    #ar-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; color: #C9A45C; font: 600 15px -apple-system, system-ui, sans-serif;
      letter-spacing: .08em; transition: opacity .3s; }
    #ar-loading img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 0 40px rgba(201,164,92,.25); }
    #ar-loading .bar { width: 120px; height: 3px; background: #242C36; border-radius: 2px; overflow: hidden; }
    #ar-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #C9A45C;
      animation: ar-slide 1.1s ease-in-out infinite; }
    @keyframes ar-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
